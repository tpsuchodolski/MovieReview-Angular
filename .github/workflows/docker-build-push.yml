name: Build, Containerize, and Push

on:
  push:
    branches:
      - Movie-Review-Angular

jobs:
  build-and-push:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet packages
      run: nuget restore MovieReview.Web/MovieReview.Web.csproj -SolutionDirectory MovieReview.Web

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3

    - name: Build solution
      run: msbuild MovieReview.Web/MovieReview.Web.csproj /p:Configuration=Release

    - name: Clean publish directory
      run: |
        if (Test-Path publish) { Remove-Item publish -Recurse -Force }

    - name: Create publish directory
      run: mkdir publish

    - name: Create exclude file
      run: |
        echo obj\ > exclude.txt
        echo bin\Debug\ >> exclude.txt
        echo publish\ >> exclude.txt
        echo packages\ >> exclude.txt
        echo .vs\ >> exclude.txt
        echo node_modules\ >> exclude.txt
        echo TestResults\ >> exclude.txt

    - name: Copy web content files (excluding unwanted folders)
      run: xcopy MovieReview.Web\* publish\ /s /y /exclude:exclude.txt

    - name: Copy build output (DLLs and dependencies)
      run: xcopy MovieReview.Web\bin\* publish\bin\ /s /y

    - name: List bin directory
      run: dir MovieReview.Web\bin

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/moviereview:latest .

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker image
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/moviereview:latest