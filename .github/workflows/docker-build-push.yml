name: Build, Containerize, and Push

on:
  push:
    branches:
      - Movie-Review-Angular

jobs:
  build-and-push:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet packages
      run: nuget restore MovieReview.Web/MovieReview.Web.csproj -SolutionDirectory MovieReview.Web

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3

    - name: Build solution
      run: msbuild MovieReview.Web/MovieReview.Web.csproj /p:Configuration=Release

    - name: Clean publish directory
      run: |
        if (Test-Path publish) { Remove-Item publish -Recurse -Force }

    - name: Create publish directory
      run: mkdir publish

    - name: Create exclude file
      run: |
        echo obj\ > exclude.txt
        echo bin\ > exclude.txt
        echo publish\ >> exclude.txt
        echo packages\ >> exclude.txt
        echo .vs\ >> exclude.txt
        echo node_modules\ >> exclude.txt
        echo TestResults\ >> exclude.txt
        echo .git\ >> exclude.txt
        echo .gitignore >> exclude.txt
        echo .vscode\ >> exclude.txt
        echo .idea\ >> exclude.txt
        echo test\ >> exclude.txt
        echo tests\ >> exclude.txt
        echo docs\ >> exclude.txt
        echo samples\ >> exclude.txt
        echo artifacts\ >> exclude.txt
        echo App_Data\ >> exclude.txt
        echo App_Start\ >> exclude.txt
        echo Properties\ >> exclude.txt
        echo *.config >> exclude.txt
        echo *.csproj >> exclude.txt
        echo *.sln >> exclude.txt
        echo *.db >> exclude.txt
        echo *.bak >> exclude.txt
        echo *.md >> exclude.txt
        echo *.json >> exclude.txt
        echo *.ts >> exclude.txt
        echo *.map >> exclude.txt
        echo *.xml >> exclude.txt
        echo *.yml >> exclude.txt
        echo *.yaml >> exclude.txt
        echo *.sh >> exclude.txt
        echo *.cmd >> exclude.txt
        echo *.nupkg >> exclude.txt
        echo *.vspscc >> exclude.txt
        echo *.cache >> exclude.txt
        echo *.tmp >> exclude.txt
        echo *.log >> exclude.txt
        echo *.dbmdl >> exclude.txt
        echo *.user >> exclude.txt
        echo *.suo >> exclude.txt
        echo *.vssscc >> exclude.txt
        echo *.tlog >> exclude.txt
        echo *.idb >> exclude.txt
        echo *.ipch >> exclude.txt
        echo *.sdf >> exclude.txt
        echo *.opensdf >> exclude.txt
        echo *.swp >> exclude.txt
        echo *.swo >> exclude.txt
        echo *.orig >> exclude.txt
        echo *.rej >> exclude.txt
        echo *.gz >> exclude.txt
        echo *.zip >> exclude.txt
        echo *.tar >> exclude.txt
        echo *.rar >> exclude.txt

    - name: Copy Views
      run: xcopy MovieReview.Web\Views publish\Views\ /s /y

    - name: Copy Content
      run: xcopy MovieReview.Web\Content publish\Content\ /s /y

    - name: Copy Scripts
      run: xcopy MovieReview.Web\Scripts publish\Scripts\ /s /y

    - name: Copy Web.config
      run: copy MovieReview.Web\Web.config publish\

    - name: Copy bin
      run: xcopy MovieReview.Web\bin\* publish\bin\ /s /y

    - name: List bin directory
      run: dir MovieReview.Web\bin

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/moviereview:latest .

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker image
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/moviereview:latest